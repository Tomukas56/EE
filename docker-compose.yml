# Lab PostgreSQL 18 on host port 5433.
# PG 18 images store data under /var/lib/postgresql (not .../data).
services:
  db:
    image: postgres:18-alpine
    container_name: energy_eniwhere_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
